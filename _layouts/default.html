<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">본문으로 건너뛰기</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">Bambi Lab <span>밤비네 연구소</span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="sidebar">메뉴</button>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="사이트 메뉴">
      {% include nav.html items=site.data.nav %}
    </nav>
    <main id="content" class="content">
      {{ content }}
    </main>
  </div>
  <footer class="site-footer">
    <p>밤비네 연구소 Bambi Lab · <a href="mailto:bambi.lab@janggoons.kr">bambi.lab@janggoons.kr</a></p>
    <p>
      <a rel="license" href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a> —
      저작자를 밝히면 자유롭게 이용할 수 있으며, 영리 목적으로는 이용할 수 없습니다.
    </p>
  </footer>
  <script>
    (function () {
      var b = document.querySelector('.menu-btn'), s = document.getElementById('sidebar');
      b.addEventListener('click', function () {
        var o = s.classList.toggle('open');
        b.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
